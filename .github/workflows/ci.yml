name: CI

# Public tap: GitHub-hosted runners are free here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# brew audit --online calls the GitHub API; unauthenticated calls from shared runner
# IPs hit the anonymous rate limit. The built-in read-only token lifts it.
env:
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Every formula and cask moved to consolelabs/homebrew-tap; this tap keeps only the
  # rename and migration maps, so CI checks that each map parses and points somewhere.
  maps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Maps parse and point at a tap
        run: |
          python3 - <<'EOF'
          import json
          for f in ("tap_migrations.json", "formula_renames.json", "cask_renames.json"):
              d = json.load(open(f))
              assert d and all(isinstance(v, str) and v for v in d.values()), f
          m = json.load(open("tap_migrations.json"))
          assert all(v.startswith("consolelabs/tap") for v in m.values()), m
          print("maps ok")
          EOF
